# =============================================================================
#  Trợ lý ảo hỗ trợ sinh viên — môi trường PRODUCTION
#
#      npm run docker:prod          # = docker compose -f docker-compose.prod.yml up -d --build
#      npm run docker:prod:down
#
#  Mọi service trong file này chạy cùng nhau — không có profile, vì đây là
#  file dành riêng cho triển khai. Muốn môi trường phát triển với hot-reload,
#  dùng `docker-compose.dev.yml` (hoặc `scripts/chay.ps1` để chạy trên host).
#
#  Giới hạn RAM siết cho máy đích 8 GB. rag-service nạp model int8 dựng sẵn
#  (scripts/quantize_models.py) nên không còn đỉnh RAM fp32+int8 cùng lúc lúc
#  khởi động — chạy script đó TRƯỚC lần lên container đầu tiên, nếu không
#  rag-service tự lượng tử hóa lúc chạy và cần nhiều RAM hơn giới hạn 2g dưới.
# =============================================================================

name: student-assistant

services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-student_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-student_assistant}
      # Ảnh hưởng tới cách PostgreSQL diễn giải timestamptz khi hiển thị.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
      # initdb chỉ chạy lần đầu; ép collation C.UTF-8 để so sánh chuỗi
      # tiếng Việt ổn định giữa các máy.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-student_assistant} -d ${POSTGRES_DB:-student_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
    # Máy 8 GB: giảm connection pool và shared_buffers so với mặc định.
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=192MB
      - -c
      - work_mem=8MB
      - -c
      - timezone=Asia/Ho_Chi_Minh

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sa-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
      # Vector của BGE-M3 là 1024 chiều float32; corpus demo vài nghìn chunk
      # nên giữ toàn bộ trên RAM là hợp lý, không cần mmap.
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Ảnh qdrant không có curl/wget; dùng chính binary của nó để tự kiểm tra.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768m

  rag-service:
    build:
      context: .
      dockerfile: server/rag-service/Dockerfile
      target: production
    container_name: sa-rag
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change_me_internal_token}
      ANSWER_THRESHOLD: ${ANSWER_THRESHOLD:-0.050}
      CANDIDATES_K: ${CANDIDATES_K:-12}
      QUANTIZE_RERANKER: ${QUANTIZE_RERANKER:-1}
      QUANTIZE_ENCODER: ${QUANTIZE_ENCODER:-1}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-0}
    volumes:
      # Mô hình: tải một lần, dùng lại cho mọi lần build sau.
      - models:/models
      # Chỉ mục BM25 và ngưỡng τ đã calibrate — mất là nhánh lexical im lặng
      # biến mất và cổng abstention chạy bằng một τ đoán bừa.
      - ./server/rag-service/var:/app/var
      # Tài liệu gốc, chỉ đọc: dịch vụ chỉ cần đọc để nạp chỉ mục.
      - ./server/data:/server/data:ro
      - ./server/storage:/server/storage:ro
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "${RAG_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          # Đo thực tế (docker stats, PRELOAD_MODELS=1, cả hai model int8 dựng
          # sẵn qua scripts/quantize_models.py đã nạp): ~1.93 GB RAM nghỉ, tức
          # ~96% một giới hạn 2g — không còn chỗ cho batch encode/rerank lúc có
          # truy vấn thật. Test trực tiếp: nạp thêm một bản model thứ hai trong
          # lúc bản đầu đã resident làm container bị OOM-kill ở 2g. 3g để lại
          # biên thật cho tải truy vấn đồng thời, không phải chỉ cho lúc nghỉ.
          #
          # Chưa chạy scripts/quantize_models.py thì rag-service tự lượng tử
          # hóa lúc chạy (fp32 + int8 cùng tồn tại một lúc) và cần nhiều RAM
          # hơn nữa — luôn chạy script đó trước khi lên container.
          memory: 3g

  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
      target: production
    container_name: sa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-student_assistant}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-student_assistant}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?bat buoc phai dat JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?bat buoc phai dat JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-change_me_internal_token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      # storage/ ghi được: đơn đã dựng và ảnh chữ ký nằm ở đây, mất là mã băm
      # trong submission_signings không còn đối chiếu được với gì cả.
      - ./server/storage:/app/server/storage
      - ./server/data:/app/server/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    deploy:
      resources:
        limits:
          memory: 384m

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        # Build-arg chứ không phải biến môi trường: Vite nhúng VITE_* vào
        # bundle lúc build, đặt lúc chạy không có tác dụng.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: sa-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:5173"
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres-data:
    name: sa-postgres-data
  qdrant-data:
    name: sa-qdrant-data
  models:
    name: sa-models
